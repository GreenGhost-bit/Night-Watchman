# The workflow doesn't write on-chain itself — the signed authorization is
# consumed by agent/src/index.ts, which calls WatchmanVault.executeDefense.
# So `cre workflow simulate` needs no RPC. Sepolia is declared here because
# `cre workflow deploy` registers against a chain's Workflow Registry.
#
# ${VAR} resolves from .env or the shell; never committed.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}

production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}
