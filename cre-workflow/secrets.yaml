# ==========================================================================
# CRE SECRETS MAPPING
# ==========================================================================
# Maps the workflow-facing secret IDs referenced in config.*.json's
# `secretsIds` block to the environment variable(s) that actually hold the
# private policy value. Values themselves live only in `.env` (gitignored)
# or, for a real deploy, in the CRE Vault DON -- never in this file, never in
# config.*.json, and never in workflow.ts.
#
# These three secrets are precisely the "private policy" this Confidential
# Workflow exists to protect: the trigger threshold, the emergency-capital
# cap, and the execution credential reference. See README.md.
# ==========================================================================
secretsNames:
  night_watchman_min_health_factor_bps:
    - NIGHT_WATCHMAN_MIN_HEALTH_FACTOR_BPS
  night_watchman_max_defense_usdc:
    - NIGHT_WATCHMAN_MAX_DEFENSE_USDC
  night_watchman_execution_key_ref:
    - NIGHT_WATCHMAN_EXECUTION_KEY_REF
