# Maps the secret IDs referenced in config.*.json to the env vars holding
# them. Values live in .env (gitignored) or the CRE Vault DON for a real
# deploy — never here, and never in workflow.ts.
#
# These three ARE the private defense policy: trigger threshold, capital cap,
# and execution credential.
secretsNames:
  night_watchman_min_health_factor_bps:
    - NIGHT_WATCHMAN_MIN_HEALTH_FACTOR_BPS
  night_watchman_max_defense_usdc:
    - NIGHT_WATCHMAN_MAX_DEFENSE_USDC
  night_watchman_execution_key_ref:
    - NIGHT_WATCHMAN_EXECUTION_KEY_REF
