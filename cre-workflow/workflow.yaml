# workflow-path points at main.ts (the Runner entry point), not workflow.ts
# (the testable logic module). See main.ts for why the split is needed.
staging-settings:
  user-workflow:
    workflow-name: "lamplighter-defense-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "./secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "lamplighter-defense-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "./secrets.yaml"
