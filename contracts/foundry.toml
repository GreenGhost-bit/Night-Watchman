[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }

[lint]
# missing-events-access-control: balance writes are covered by the Deposited/
#   Withdrawn/DefenseExecuted events in the same functions.
# block-timestamp: the per-day spend window resets on a 24h boundary; validator
#   drift is immaterial at daily granularity.
# reentrancy-events: fires on forge-std's standard vm.expectEmit() test pattern.
exclude_lints = ["missing-events-access-control", "block-timestamp", "reentrancy-events"]
